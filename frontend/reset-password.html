<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <form id="resetPasswordForm">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p id="message"></p>

</div>

<script>

const form = document.getElementById("resetPasswordForm");
const message = document.getElementById("message");

// Get token from URL
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
    message.textContent = "Invalid or missing reset token.";
    form.style.display = "none";
}

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent =
            "Passwords do not match.";
        return;
    }

    try {

        const response = await fetch(
            "https://student-performance-system-production-b81a.up.railway.app/api/auth/reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    token: token,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Unable to reset password.";
            return;
        }

        message.textContent =
            data.message || "Password reset successfully.";

        form.reset();

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to the server.";
    }

});

</script>

</body>
</html>
