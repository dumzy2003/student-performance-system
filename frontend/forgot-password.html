<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Student Portal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- Header -->

            <div class="auth-header">

                <div class="auth-icon">
                    <i data-lucide="key-round"></i>
                </div>

                <h1>Forgot Password?</h1>

                <p>
                    Enter your matric number and registered
                    email address to request a password reset.
                </p>

            </div>


            <!-- Form -->

            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="matricNumber">
                        Matric Number
                    </label>

                    <input
                        type="text"
                        id="matricNumber"
                        name="matricNumber"
                        placeholder="e.g. IT/2025/001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <!-- Message -->

                <div
                    id="forgotPasswordMessage"
                    class="form-message"
                ></div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn-primary"
                    id="forgotPasswordButton"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Footer -->

            <div class="auth-footer">

                <a href="index.html">
                    <i data-lucide="arrow-left"></i>
                    Back to Login
                </a>

            </div>

        </div>

    </main>


    <script src="js/forgot-password.js"></script>

    <script>

        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }

    </script>

</body>

</html>
