<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-brand">
            <img src="student-head-svgrepo-com (2).svg" alt="" width="50" height="50">

            <h1>Student Portal</h1>

            <p>
                Academic Performance & Student Management System
            </p>
        </section>


        <section class="login-card">

            <div class="login-header">
                <span class="eyebrow">STUDENT ACCESS</span>

                <h2>Welcome back</h2>

                <p>
                    Sign in to view your academic information.
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">
                    <label for="matricNumber">
                        Matric Number
                    </label>

                    <input
                        type="text"
                        id="matricNumber"
                        placeholder="e.g. IT/2025/001"
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >
                </div>


                <div class="form-options">

                    <label class="checkbox-label">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPasswordLink">
    Forgot your password?
</a>

                </div>


                <button type="submit" class="primary-button full-width">
                    Sign in
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>


            <div class="demo-login">

                <span>Demo credentials</span>

                <p>
                    IT/2025/001 &nbsp; / &nbsp; 12345
                </p>

            </div>

        </section>


        <footer class="login-footer">
            © 2026 Student Performance Analytics System
        </footer>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
